<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="bsT bsD">
<title id="bsT">Exploded king bed stack</title>
<desc id="bsD">Four separated layers: soft topper, knit cover band, firm foam core, and wooden slatted base, with dashed alignment guides.</desc>
<rect width="640" height="520" rx="18" fill="#121926"/>
<rect x="24" y="20" width="592" height="480" rx="14" fill="none" stroke="#26334A" stroke-width="2"/>
<g stroke="#3B4D6B" stroke-width="1.5" stroke-dasharray="7 6">
  <line x1="120" y1="60" x2="120" y2="470"/>
  <line x1="520" y1="60" x2="520" y2="470"/>
</g>
<g>
  <polygon points="90,90 550,90 500,150 140,150" fill="#1B2740" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="140,150 500,150 500,178 140,178" fill="#162032" stroke="#22D3EE" stroke-width="2"/>
  <text x="320" y="128" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="bold" fill="#E9EEF6">4&#8243; soft topper</text>
  <text x="320" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#A3B1C8">comfort layer &#183; replaceable</text>
</g>
<g font-family="system-ui,sans-serif" font-size="12" fill="#22D3EE">
  <text x="560" y="200" text-anchor="middle"> slip</text>
  <line x1="548" y1="182" x2="548" y2="216" stroke="#22D3EE" stroke-width="2"/>
</g>
<g>
  <polygon points="100,218 540,218 500,268 140,268" fill="none" stroke="#A3E635" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="320" y="248" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="bold" fill="#A3E635">knit cover &#183; $64.99</text>
</g>
<g>
  <polygon points="90,282 550,282 500,352 140,352" fill="#164E63" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="140,352 500,352 500,392 140,392" fill="#0E3A4A" stroke="#22D3EE" stroke-width="2"/>
  <text x="320" y="326" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#E9EEF6">6&#8243; firm core &#183; 50 ILD</text>
  <text x="320" y="378" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#A3B1C8">support layer &#183; 76&#215;80 king</text>
</g>
<g>
  <g fill="#8A6A3C" stroke="#DDB271" stroke-width="1.5">
    <rect x="110" y="420" width="60" height="18" rx="3"/>
    <rect x="185" y="420" width="60" height="18" rx="3"/>
    <rect x="260" y="420" width="60" height="18" rx="3"/>
    <rect x="335" y="420" width="60" height="18" rx="3"/>
    <rect x="410" y="420" width="60" height="18" rx="3"/>
  </g>
  <rect x="95" y="438" width="450" height="16" rx="4" fill="#6E5426" stroke="#DDB271" stroke-width="1.5"/>
  <text x="320" y="478" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="bold" fill="#A3E635">floor-supported 2&#215;4 slat base</text>
</g>
<text x="320" y="502" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7E8DA6">each layer lifts off &#183; replace only what wears out</text>
</svg>
