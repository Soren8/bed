<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="bsT bsD">
<title id="bsT">King bed stack order</title>
<desc id="bsD">Top to bottom: soft topper and firm core together inside one shared knit cover, then the floor-supported wooden slat base. Fitted sheets wrap the whole stack.</desc>
<rect width="640" height="460" rx="18" fill="#121926"/>
<rect x="24" y="16" width="592" height="428" rx="14" fill="none" stroke="#26334A" stroke-width="2"/>
<g stroke="#3B4D6B" stroke-width="1.5" stroke-dasharray="7 6">
  <line x1="110" y1="48" x2="110" y2="392"/>
  <line x1="530" y1="48" x2="530" y2="392"/>
</g>
<!-- shared cover envelope around topper + core -->
<rect x="80" y="54" width="480" height="236" rx="14" fill="rgba(163,230,53,0.06)" stroke="#A3E635" stroke-width="3"/>
<text x="320" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="bold" fill="#A3E635">knit cover &#183; $64.99 &#183; encloses both</text>
<g>
  <polygon points="90,94 550,94 505,138 135,138" fill="#1B2740" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="135,138 505,138 505,164 135,164" fill="#162032" stroke="#22D3EE" stroke-width="2"/>
  <text x="320" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="bold" fill="#E9EEF6">soft topper &#183; comfort</text>
  <text x="320" y="157" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#A3B1C8">replaceable comfort layer</text>
</g>
<g>
  <rect x="112" y="172" width="416" height="92" rx="8" fill="#164E63" stroke="#22D3EE" stroke-width="2"/>
  <text x="320" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="bold" fill="#E9EEF6">firm core &#183; support</text>
  <text x="320" y="244" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#A3B1C8">stays flat for years</text>
</g>
<text x="320" y="281" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#7E8DA6">cover depth = core + topper &#183; 6+2 &#8594; 8&#8243;</text>
<g>
  <g fill="#8A6A3C" stroke="#DDB271" stroke-width="1.5">
    <rect x="110" y="318" width="60" height="20" rx="3"/>
    <rect x="185" y="318" width="60" height="20" rx="3"/>
    <rect x="260" y="318" width="60" height="20" rx="3"/>
    <rect x="335" y="318" width="60" height="20" rx="3"/>
    <rect x="410" y="318" width="60" height="20" rx="3"/>
  </g>
  <rect x="95" y="340" width="450" height="18" rx="4" fill="#6E5426" stroke="#DDB271" stroke-width="1.5"/>
  <text x="320" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#A3E635">floor-supported 2&#215;4 slat base</text>
</g>
<text x="320" y="428" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#7E8DA6">fitted sheets wrap the whole stack</text>
</svg>
