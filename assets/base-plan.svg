  <g fill="#C49A58" stroke="#6E5426" stroke-width="1.2">
    <rect x="120" y="80" width="361" height="16.62" rx="2"/>
    <rect x="120" y="107.95" width="361" height="16.62" rx="2"/>
    <rect x="120" y="135.9" width="361" height="16.62" rx="2"/>
    <rect x="120" y="163.86" width="361" height="16.62" rx="2"/>
    <rect x="120" y="191.81" width="361" height="16.62" rx="2"/>
    <rect x="120" y="219.76" width="361" height="16.62" rx="2"/>
    <rect x="120" y="247.71" width="361" height="16.62" rx="2"/>
    <rect x="120" y="275.66" width="361" height="16.62" rx="2"/>
    <rect x="120" y="303.62" width="361" height="16.62" rx="2"/>
    <rect x="120" y="331.57" width="361" height="16.62" rx="2"/>
    <rect x="120" y="359.52" width="361" height="16.62" rx="2"/>
    <rect x="120" y="387.47" width="361" height="16.62" rx="2"/>
    <rect x="120" y="415.42" width="361" height="16.62" rx="2"/>
    <rect x="120" y="443.38" width="361" height="16.62" rx="2"/>
  </g>
  <text x="300.5" y="74" text-anchor="middle" font-size="12" fill="#A3B1C8">TOP VIEW &#183; 14 slats 76&#8243; flat &#183; gaps &#8776;2.39&#8243;</text>
  <text x="112" y="270" text-anchor="end" font-size="12" fill="#A3B1C8" transform="rotate(-90 112,270)">80&#8243; sides</text>
  <text x="300.5" y="482" text-anchor="middle" font-size="12" fill="#A3B1C8">76&#8243; outside &#183; ends 73&#8243; between sides &#183; center 77&#8243;</text>
  <text x="300.5" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#0B0F14" transform="rotate(90 300.5,270)">CENTER</text>
</g>
<g font-family="system-ui,sans-serif">
  <text x="710" y="74" text-anchor="middle" font-size="12" fill="#A3B1C8">SIDE SECTION &#183; floor-supported</text>
  <rect x="600" y="120" width="220" height="200" rx="8" fill="#162032" stroke="#26334A" stroke-width="2"/>
  <rect x="600" y="300" width="220" height="10" fill="#7E8DA6"/>
  <text x="600" y="326" font-size="11" fill="#A3B1C8">floor (rails + center rest on it)</text>
  <rect x="620" y="180" width="180" height="120" rx="4" fill="#8A6A3C" stroke="#DDB271" stroke-width="2"/>
  <rect x="610" y="150" width="200" height="30" rx="4" fill="#C49A58" stroke="#6E5426" stroke-width="2"/>
  <line x1="830" y1="150" x2="830" y2="180" stroke="#22D3EE" stroke-width="2"/>
  <text x="838" y="170" font-size="12" font-weight="bold" fill="#22D3EE">1.5&#8243;</text>
  <line x1="830" y1="180" x2="830" y2="300" stroke="#A3E635" stroke-width="2"/>
