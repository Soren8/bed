  <text x="710" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="bold" fill="#E9EEF6">deck = 5&#8243;</text>
  <text x="710" y="382" text-anchor="middle" font-size="12" fill="#A3B1C8">slat spans &#8776;35.75&#8243; each side of center</text>
  <g font-size="12" fill="#E9EEF6">
    <rect x="600" y="410" width="220" height="78" rx="8" fill="#0E2A1A" stroke="#A3E635" stroke-width="2"/>
    <text x="710" y="432" text-anchor="middle" font-weight="bold" fill="#A3E635">Build notes</text>
    <text x="710" y="450" text-anchor="middle" fill="#E9EEF6">96&#8243; boards, not 92&#8541;&#8243; studs</text>
    <text x="710" y="468" text-anchor="middle" fill="#E9EEF6">square frame + offcut blocking</text>
  </g>
</g>
</svg>
