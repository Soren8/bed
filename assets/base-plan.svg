<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="bpT bpD">
<title id="bpT">DIY 2 by 4 king base plan</title>
<desc id="bpD">Top view of a 76 by 80 inch frame with side rails, end rails, center beam and fourteen slats, plus a side section showing 3.5 inch rails plus 1.5 inch slats equals 5 inch deck height.</desc>
<rect width="900" height="520" rx="18" fill="#121926"/>
<rect x="20" y="16" width="860" height="488" rx="14" fill="none" stroke="#26334A" stroke-width="2"/>
<text x="450" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="bold" fill="#E9EEF6">Low king base &#183; outside 76&#8243; &#215; 80&#8243; &#183; 19 boards</text>
<g font-family="system-ui,sans-serif" font-size="13" fill="#E9EEF6">
  <rect x="120" y="80" width="361" height="380" rx="6" fill="#162032" stroke="#8A6A3C" stroke-width="3"/>
  <rect x="120" y="80" width="7.12" height="380" fill="#8A6A3C" stroke="#DDB271" stroke-width="1"/>
